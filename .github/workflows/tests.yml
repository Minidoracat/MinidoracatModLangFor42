# 回歸測試（PZ B42 如一模組翻譯繁中版）
#
# 存在理由：`scripts/test_*.py` 這批 gate 過去**沒有任何自動執行者**——repo 唯一的
# workflow 是 track_upstreams.yml，它只跑 tracker.py。AGENTS.md 因此明載「這（當時的）10 支
# 測試全靠收尾驗證階段人工跑。要讓它真的攔得住漏跑，得另外接 CI」。本檔就是那個 CI。
# 下方 `tests` 陣列即現行全集（**不在此寫死支數**，否則加了測試漏改就是假帳）；與該歷史
# 引述的 10 支不同是正常的——後續新增測試會續增。
#
# 實際漏掉過的例子：
#   * c8f5064（排程刷新 sources/en）→ SUPPORTED_MODS.md 的「覆寫本體」欄靜默過期一整天，
#     build／verify／lint 三道全綠，`test_manifest_fresh.py` 抓得到卻沒人跑。
#   * cfcf3d8 同款前例（改了來源沒重跑 manifest，鍵數錯一整天）。
#
# ⚠️ `scripts/test_vanilla_no_override.py` **刻意不納入**：它是對「本機 PZ 安裝現況」的
#    端到端斷言（讀 D:/SteamLibrary/.../ProjectZomboid/media/lua/shared/Translate），
#    且在本體安裝不存在時一律判失敗、沒有豁免旗標——那個 fail-closed 正是它的設計要點，
#    不可為了讓 CI 變綠而改。它仍屬收尾驗證階段的人工步驟（見 AGENTS.md）。
#
# 同理未納入 build/verify 全鏈：verify_dist 的 [8] As1 來源漂移需要 Steam 管理的 As1
# 快照樹，CI 上不存在，帶 --allow-missing-as1 的 PASS 等於沒驗 As1 端。

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false # 全部純標準函式庫，無相依可快取

      # 逐支跑並收集結果，讓一支失敗不遮蔽其餘（CI 一次看完所有紅燈）。
      # 清單用陣列，計數一律由 ${#tests[@]} 派生——寫死支數的話，加測試時漏改就會
      # 輸出騙人的「N 支全過」（本 repo 已有 manifest 數字過期一整天的前例）。
      - name: 回歸測試（純 repo gate）
        run: |
          set -u
          tests=(
            test_apply_gates
            test_backfill_writeorder
            test_ch_lane
            test_format_tokens
            test_itemname_dead_keys
            test_manifest_fresh
            test_own_cn_glyphs
            test_own_lane
            test_owner_json_en
            test_prep_item_dn
            test_recipe_dead_keys
            test_serialization
            test_unshipped_keys
            test_untranslatable_keys
            test_vanilla_suppress
            test_verify_as1_skip
          )
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if uv run "scripts/$t.py"; then
              echo "✅ $t"
            else
              echo "❌ $t"
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]}/${#tests[@]} 支回歸測試失敗：${failed[*]}"
            exit 1
          fi
          echo "✅ ${#tests[@]} 支回歸測試全過"

      # owner census 全庫裁決閘門：不產生翻譯待辦，只驗 decision／unship signature 與
      # 衝突消失後的退役訊號。正式 build/verify 不讀 tracker census，這道 CI 不可省。
      # 同時驗 OWNER_CONFLICTS.md 是否與「裁決台帳＋census」同步——它是生成物，改了
      # 台帳卻沒重跑就會靜默停在舊內容（同 SUPPORTED_MODS.md 漂移一整天的前例）。
      - name: owner conflict decisions ＋ OWNER_CONFLICTS.md 同步
        run: |
          uv run scripts/prep_mod_strings.py --check-decisions --owner-report-check \
            --out /tmp/owner-decisions.json

      # tracker 自身的十五情境 mock 測試（純記憶體，不碰網路與 git 遠端）
      - name: tracker self-test
        run: uv run scripts/tracker.py self-test

      # corpus 品質棘輪：[A] 十族 regex／[B] 異體字／[C] select 術語超過零基線即紅
      - name: lint_ch 棘輪
        run: uv run scripts/lint_ch.py
